<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Report — BearingIQ</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/chart.umd.min.js"></script>
  <style>
    /* ── Report-specific styles ── */
    .report-topbar-btns { display:flex; gap:var(--sp-3); align-items:center; }
    .btn-print {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white; border: none; padding: 10px 20px;
      border-radius: 10px; font-size:.85rem; font-weight:700;
      cursor:pointer; display:flex; align-items:center; gap:8px;
      box-shadow: 0 4px 12px rgba(16,185,129,.3);
      transition: all .2s;
    }
    .btn-print:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(16,185,129,.4); }

    .report-status {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 2px solid #bbf7d0;
      border-radius: var(--r-lg);
      padding: var(--sp-4) var(--sp-6);
      display: flex; align-items: center; gap: var(--sp-4);
      margin-bottom: var(--sp-6);
    }
    .report-status-icon { font-size: 2rem; }
    .report-status-text strong { color: #065f46; font-size:1rem; display:block; }
    .report-status-text span { color: #047857; font-size:.8rem; }

    /* ── Report pages ── */
    .report-pages { display: flex; flex-direction: column; gap: var(--sp-8); }

    .report-page {
      background: white;
      border-radius: var(--r-xl);
      border: 2px solid var(--clr-border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      break-inside: avoid;
    }

    .report-page-header {
      padding: var(--sp-6) var(--sp-8);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 3px solid;
    }
    .rph-1 { background: linear-gradient(135deg,#4f46e5,#7c3aed); border-color: #4f46e5; color:white; }
    .rph-2 { background: linear-gradient(135deg,#0891b2,#06b6d4); border-color: #0891b2; color:white; }
    .rph-3 { background: linear-gradient(135deg,#059669,#10b981); border-color: #059669; color:white; }
    .rph-4 { background: linear-gradient(135deg,#d97706,#f59e0b); border-color: #d97706; color:white; }

    .rph-page-num {
      font-size:3rem; font-weight:900; opacity:.2; line-height:1;
    }
    .rph-title { font-size:1.4rem; font-weight:800; margin-bottom:4px; }
    .rph-sub { font-size:.8rem; opacity:.8; }

    .report-body { padding: var(--sp-8); }

    /* KPI cards */
    .report-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-4);
      margin-bottom: var(--sp-6);
    }
    .report-kpi {
      background: linear-gradient(135deg, var(--kc, #4f46e5), var(--kc2, #7c3aed));
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      color: white;
      text-align: center;
    }
    .report-kpi-val { font-size: 2.2rem; font-weight:900; line-height:1; }
    .report-kpi-lbl { font-size:.7rem; opacity:.85; margin-top:6px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }

    /* Section titles */
    .report-section-title {
      font-size:1rem; font-weight:800;
      color: var(--clr-text);
      border-bottom: 2px solid var(--clr-border);
      padding-bottom: var(--sp-2);
      margin-bottom: var(--sp-4);
      display: flex; align-items:center; gap:var(--sp-2);
    }

    /* Two-column grid */
    .report-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-6); }
    .report-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--sp-4); }

    /* Fault table */
    .fault-table { width:100%; border-collapse:collapse; font-size:.82rem; }
    .fault-table th {
      background: var(--clr-surface-2);
      color: var(--clr-text-muted);
      font-size:.7rem; text-transform:uppercase; letter-spacing:.05em;
      padding: var(--sp-3) var(--sp-4); text-align:left;
      border-bottom:2px solid var(--clr-border);
    }
    .fault-table td { padding: var(--sp-3) var(--sp-4); border-bottom:1px solid var(--clr-border); }
    .fault-table tr:last-child td { border-bottom:none; }
    .fault-table tr:hover td { background: var(--clr-surface-2); }

    .sev-badge {
      display:inline-block; padding:2px 8px; border-radius:20px;
      font-size:.68rem; font-weight:700; border:1px solid currentColor;
    }

    /* Observation boxes */
    .obs-box {
      background: var(--clr-surface-2);
      border: 1px solid var(--clr-border);
      border-left: 4px solid var(--clr-primary);
      border-radius: var(--r-md);
      padding: var(--sp-4);
      margin-bottom: var(--sp-4);
    }
    .obs-box.green { border-left-color:#10b981; }
    .obs-box.orange { border-left-color:#f97316; }
    .obs-box.purple { border-left-color:#8b5cf6; }
    .obs-box.blue { border-left-color:#3b82f6; }
    .obs-title { font-size:.78rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--clr-text-muted); margin-bottom:var(--sp-2); }
    .obs-text { font-size:.85rem; color:var(--clr-text-muted); line-height:1.65; }

    /* Model metrics */
    .model-metric-row { display:flex; align-items:center; gap:var(--sp-4); margin-bottom:var(--sp-3); }
    .model-metric-label { font-size:.78rem; font-weight:700; width:130px; flex-shrink:0; }
    .model-metric-bar-wrap { flex:1; background:var(--clr-border); border-radius:20px; overflow:hidden; height:10px; }
    .model-metric-bar { height:100%; border-radius:20px; }
    .model-metric-val { font-size:.82rem; font-weight:800; width:55px; text-align:right; }

    /* CV scores */
    .cv-scores { display:flex; gap:var(--sp-2); margin-top:var(--sp-2); }
    .cv-score-pill {
      background: var(--clr-primary-light);
      color: var(--clr-primary);
      padding: 3px 10px; border-radius:20px;
      font-size:.72rem; font-weight:700;
      border: 1px solid #c7d2fe;
    }

    /* Heatmap */
    .heatmap-wrap { overflow:hidden; border-radius:var(--r-md); }

    /* Confusion matrix */
    .cm-wrap { overflow-x:auto; }
    .cm-table { border-collapse:collapse; font-size:.65rem; }
    .cm-table th { padding:4px 6px; background:var(--clr-surface-2); text-align:center; font-weight:700; }
    .cm-table td { padding:4px 6px; text-align:center; }
    .cm-diag { background: #4f46e5; color:white; font-weight:900; }

    /* Signature section */
    .signature-section {
      border-top: 2px dashed var(--clr-border);
      margin-top: var(--sp-8);
      padding-top: var(--sp-6);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--sp-6);
    }
    .sig-line {
      border-bottom: 2px solid var(--clr-border);
      height: 48px;
      margin-bottom: var(--sp-2);
    }
    .sig-label { font-size:.72rem; color:var(--clr-text-muted); font-weight:600; }

    /* Print styles */
    @media print {
      .sidebar, .topbar, .report-status, .btn-print, .report-topbar-btns { display:none!important; }
      .main-wrapper { margin-left:0!important; }
      .page-content { padding: 0!important; }
      .report-page { box-shadow:none!important; border:1px solid #e2e8f8!important; margin-bottom:0!important; page-break-after:always; }
    }

    .loading-report {
      text-align:center; padding:var(--sp-16);
      color:var(--clr-text-muted);
    }
    .loading-report .spinner { margin:0 auto var(--sp-4); }

    /* chart areas */
    .report-chart { height:260px; position:relative; }

    .feature-imp-bar {
      display:flex; align-items:center; gap:var(--sp-3);
      margin-bottom:var(--sp-2);
    }
    .fi-label { width:70px; font-size:.75rem; font-weight:700; text-align:right; color:var(--clr-text); }
    .fi-bar-wrap { flex:1; background:var(--clr-border); border-radius:20px; overflow:hidden; height:12px; }
    .fi-bar { height:100%; border-radius:20px; }
    .fi-val { font-size:.72rem; font-weight:800; width:45px; text-align:right; color:var(--clr-primary); }

    .per-class-grid { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
    .class-stat-card {
      border-radius:var(--r-md);
      padding: var(--sp-3) var(--sp-4);
      border: 2px solid;
    }
    .cs-name { font-size:.75rem; font-weight:800; margin-bottom:4px; }
    .cs-vals { display:flex; gap:var(--sp-3); flex-wrap:wrap; }
    .cs-val { font-size:.68rem; }
    .cs-key { font-weight:700; }
  </style>
</head>
<body>

<!-- SIDEBAR --><script src="../js/sidebar.js"></script>

<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <div>
        <div class="topbar-title">Full Diagnostic Report</div>
        <div class="topbar-breadcrumb">BearingIQ → Report</div>
      </div>
    </div>
    <div class="topbar-right report-topbar-btns">
      <button class="btn btn-sm btn-ghost" id="btn-refresh-report">🔄 Refresh</button>
      <button class="btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
  </header>

  <main class="page-content">
    <div class="report-status">
      <div class="report-status-icon">📊</div>
      <div class="report-status-text">
        <strong>BearingIQ Diagnostic Report — Auto-generated</strong>
        <span id="report-gen-time">Loading report data from backend…</span>
      </div>
    </div>

    <div id="report-content">
      <div class="loading-report">
        <div class="spinner" style="width:48px;height:48px;border-width:5px;margin:0 auto 1rem;"></div>
        <p>Generating report from live data…</p>
        <p style="font-size:.8rem;margin-top:.5rem;color:var(--clr-text-light)">Make sure the Flask backend is running on port 5000</p>
      </div>
    </div>
  </main>
</div>

<script src="../js/main.js"></script>
<script>
const { apiFetch, FAULT_META, FEATURES, fmt, animateCounter } = window.BIQ;
let reportData = null;

/* ── Severity helpers ── */
const SEV_LABELS = {0:'Healthy',1:'Low',2:'Moderate',3:'Critical'};
const SEV_COLORS = {0:'#10b981',1:'#f59e0b',2:'#f97316',3:'#ef4444'};

/* ── Load all data ── */
async function loadReport() {
  try {
    const data = await apiFetch('/report');
    reportData = data;
    document.getElementById('report-gen-time').textContent =
      `Generated at: ${new Date(data.generated_at || Date.now()).toLocaleString()} · ${data.total_samples} samples · ${data.classes.length} fault classes`;
    renderReport(data);
  } catch(e) {
    document.getElementById('report-content').innerHTML = `
      <div style="text-align:center;padding:4rem;color:var(--clr-text-muted)">
        <div style="font-size:3rem;margin-bottom:1rem">⚠️</div>
        <h2 style="color:var(--clr-text);margin-bottom:.5rem">Backend Not Connected</h2>
        <p>Start the Flask server first:</p>
        <code style="background:#0f172a;color:#e2e8f0;padding:.5rem 1rem;border-radius:8px;display:block;margin:1rem auto;max-width:400px">
          python app/backend/app.py
        </code>
        <button class="btn btn-primary" onclick="loadReport()" style="margin-top:1rem">🔄 Retry</button>
      </div>`;
  }
}

/* ── Render full report ── */
function renderReport(data) {
  const mi = data.model_info || {};
  const rf = mi.random_forest || {};
  const svm = mi.svm || {};
  const stats = data.stats || {};
  const classes = data.classes || [];
  const features = data.features || FEATURES;
  const fi = mi.feature_importances || {};

  const html = `
    <div class="report-pages">

      <!-- ╔═══════════════════════════════════════════════ PAGE 1 ═══╗ -->
      <div class="report-page">
        <div class="report-page-header rph-1">
          <div>
            <div class="rph-title">📋 Executive Summary</div>
            <div class="rph-sub">BearingIQ — Bearing Fault Diagnosis Platform · CWRU Dataset · ${new Date().getFullYear()}</div>
          </div>
          <div class="rph-page-num">01</div>
        </div>
        <div class="report-body">

          <!-- Project Header -->
          <div style="text-align:center;padding:var(--sp-6) 0 var(--sp-8);border-bottom:2px solid var(--clr-border);margin-bottom:var(--sp-8)">
            <div style="font-size:2.5rem;margin-bottom:var(--sp-3)">⚙️</div>
            <h1 style="font-size:2rem;font-weight:900;color:var(--clr-primary);margin-bottom:var(--sp-2)">BearingIQ Diagnostic Platform</h1>
            <p style="color:var(--clr-text-muted);font-size:.95rem;max-width:600px;margin:0 auto;line-height:1.65">
              An intelligent, embedded-systems-driven platform for predictive maintenance of electric motor bearings.
              Combining high-frequency vibration analysis with Machine Learning for early fault detection.
            </p>
            <div style="display:flex;justify-content:center;gap:var(--sp-3);margin-top:var(--sp-5);flex-wrap:wrap">
              <span style="background:#eef2ff;color:#4f46e5;border:2px solid #c7d2fe;padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:700">CWRU Bearing Dataset</span>
              <span style="background:#d1fae5;color:#065f46;border:2px solid #6ee7b7;padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:700">48 kHz Sampling</span>
              <span style="background:#ede9fe;color:#4c1d95;border:2px solid #c4b5fd;padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:700">Random Forest + SVM</span>
              <span style="background:#fef3c7;color:#92400e;border:2px solid #fcd34d;padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:700">Groq AI Adviser</span>
            </div>
          </div>

          <!-- KPI Grid -->
          <div class="report-kpi-grid" style="margin-bottom:var(--sp-8)">
            <div class="report-kpi" style="--kc:#4f46e5;--kc2:#7c3aed">
              <div class="report-kpi-val">${data.total_samples?.toLocaleString() || '2,300'}</div>
              <div class="report-kpi-lbl">Training Samples</div>
            </div>
            <div class="report-kpi" style="--kc:#059669;--kc2:#10b981">
              <div class="report-kpi-val">${rf.accuracy ? (rf.accuracy*100).toFixed(1)+'%' : '~98%'}</div>
              <div class="report-kpi-lbl">RF Accuracy</div>
            </div>
            <div class="report-kpi" style="--kc:#0891b2;--kc2:#06b6d4">
              <div class="report-kpi-val">${classes.length || 10}</div>
              <div class="report-kpi-lbl">Fault Classes</div>
            </div>
            <div class="report-kpi" style="--kc:#d97706;--kc2:#f59e0b">
              <div class="report-kpi-val">${features.length || 9}</div>
              <div class="report-kpi-lbl">Signal Features</div>
            </div>
          </div>

          <div class="report-grid-2" style="gap:var(--sp-8)">
            <!-- Fault Class Table -->
            <div>
              <div class="report-section-title">🔧 Dataset: Fault Classes</div>
              <table class="fault-table">
                <thead>
                  <tr>
                    <th>Class</th><th>Label</th><th>Type</th><th>Samples</th><th>Severity</th>
                  </tr>
                </thead>
                <tbody>
                  ${classes.map(c => `
                    <tr>
                      <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.color};margin-right:6px"></span>${c.class.replace(/_/g,' ')}</td>
                      <td style="font-weight:600">${c.label}</td>
                      <td><span style="text-transform:capitalize;color:${c.color};font-weight:700">${c.type}</span></td>
                      <td style="font-weight:700">${c.count}</td>
                      <td><span class="sev-badge" style="color:${SEV_COLORS[c.severity]};border-color:${SEV_COLORS[c.severity]};background:${SEV_COLORS[c.severity]}15">${SEV_LABELS[c.severity]}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <!-- Project Overview -->
            <div>
              <div class="report-section-title">📖 Project Overview</div>

              <div class="obs-box green">
                <div class="obs-title">🎯 Objective</div>
                <div class="obs-text">Develop an embedded-system-ready machine learning pipeline to automatically classify bearing fault types and severity levels from raw vibration sensor data, enabling predictive maintenance before catastrophic failure.</div>
              </div>

              <div class="obs-box blue">
                <div class="obs-title">🔬 Methodology</div>
                <div class="obs-text">Raw 48 kHz accelerometer signals are segmented into windows and converted to 9 time-domain statistical features (RMS, Kurtosis, Skewness, Crest Factor, etc.). These features are classified using Random Forest and SVM classifiers trained on the CWRU Bearing Dataset.</div>
              </div>

              <div class="obs-box purple">
                <div class="obs-title">⚙️ Embedded Integration</div>
                <div class="obs-text">A microcontroller (STM32 + ADXL345 accelerometer) samples at 48 kHz, computes features on-chip, and sends JSON via UART/WiFi to the BearingIQ REST API for real-time classification results.</div>
              </div>

              <div class="obs-box orange">
                <div class="obs-title">🤖 AI Adviser</div>
                <div class="obs-text">Integrated with Groq's llama-3.1-8b-instant LLM for intelligent, context-aware maintenance recommendations. Falls back to expert rule-based advice when offline.</div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- ╔═══════════════════════════════════════════════ PAGE 2 ═══╗ -->
      <div class="report-page">
        <div class="report-page-header rph-2">
          <div>
            <div class="rph-title">📈 Feature Statistics & Analysis</div>
            <div class="rph-sub">Time-domain signal features — per-class statistical breakdown</div>
          </div>
          <div class="rph-page-num">02</div>
        </div>
        <div class="report-body">

          <!-- Overall Feature Stats Table -->
          <div class="report-section-title">📊 Overall Feature Statistics (All 2,300 Samples)</div>
          <div style="overflow-x:auto;margin-bottom:var(--sp-6)">
            <table class="fault-table">
              <thead>
                <tr>
                  <th>Feature</th><th>Description</th><th>Mean</th><th>Std Dev</th><th>Min</th><th>Max</th><th>Skewness</th><th>Kurtosis</th>
                </tr>
              </thead>
              <tbody>
                ${FEATURES.map(f => {
                  const s = stats.overall?.[f] || {};
                  const descs = {
                    max:'Peak amplitude',min:'Minimum amplitude',mean:'Signal mean',
                    sd:'Standard deviation',rms:'Root mean square',
                    skewness:'Asymmetry measure',kurtosis:'Peakedness indicator',
                    crest:'Peak-to-RMS ratio',form:'RMS-to-mean-abs ratio'
                  };
                  return `<tr>
                    <td style="font-weight:800;font-family:monospace;color:var(--clr-primary)">${f}</td>
                    <td style="color:var(--clr-text-muted);font-size:.78rem">${descs[f]||f}</td>
                    <td>${fmt(s.mean,4)}</td>
                    <td>${fmt(s.std,4)}</td>
                    <td>${fmt(s.min,4)}</td>
                    <td>${fmt(s.max,4)}</td>
                    <td>${fmt(s.skewness,3)}</td>
                    <td>${fmt(s.kurtosis,3)}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>

          <!-- Per-class RMS & Kurtosis summary -->
          <div class="report-grid-2" style="margin-bottom:var(--sp-6)">
            <div>
              <div class="report-section-title">📦 RMS per Fault Class</div>
              ${(stats.per_class ? Object.entries(stats.per_class) : []).map(([cls, cdata]) => {
                const m = FAULT_META[cls] || {};
                const rms = cdata.rms || {};
                return `<div class="feature-imp-bar" style="margin-bottom:var(--sp-2)">
                  <span style="font-size:.7rem;font-weight:700;width:130px;color:${m.color||'#999'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.label||cls}</span>
                  <div class="fi-bar-wrap">
                    <div class="fi-bar" style="width:${Math.min(100,(rms.mean||0)/0.25*100)}%;background:${m.color||'#4f46e5'}"></div>
                  </div>
                  <span class="fi-val" style="color:${m.color||'#999'}">${fmt(rms.mean,4)}</span>
                </div>`;
              }).join('')}
              <div class="obs-box green" style="margin-top:var(--sp-4)">
                <div class="obs-title">📌 Observation: RMS</div>
                <div class="obs-text">RMS (Root Mean Square) energy increases progressively with fault severity. Normal bearings show RMS ≈ 0.088 g, while critical faults (0.021") exhibit RMS values exceeding 0.200 g — a 2× increase that directly correlates with vibration energy and mechanical damage extent.</div>
              </div>
            </div>
            <div>
              <div class="report-section-title">📦 Kurtosis per Fault Class</div>
              ${(stats.per_class ? Object.entries(stats.per_class) : []).map(([cls, cdata]) => {
                const m = FAULT_META[cls] || {};
                const kurt = cdata.kurtosis || {};
                const maxKurt = 2.0;
                return `<div class="feature-imp-bar" style="margin-bottom:var(--sp-2)">
                  <span style="font-size:.7rem;font-weight:700;width:130px;color:${m.color||'#999'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.label||cls}</span>
                  <div class="fi-bar-wrap">
                    <div class="fi-bar" style="width:${Math.max(0,Math.min(100,((kurt.mean||0)+1)/maxKurt*100))}%;background:${m.color||'#4f46e5'}"></div>
                  </div>
                  <span class="fi-val" style="color:${m.color||'#999'}">${fmt(kurt.mean,3)}</span>
                </div>`;
              }).join('')}
              <div class="obs-box orange" style="margin-top:var(--sp-4)">
                <div class="obs-title">📌 Observation: Kurtosis</div>
                <div class="obs-text">Kurtosis measures the impulsive content of the signal — higher values (>0.5) indicate sharp, repetitive impulses characteristic of bearing defect impacts. Ball faults produce the most distinctive kurtosis spikes, while outer race faults show more periodic, moderate kurtosis due to their deterministic impact location at the load zone.</div>
              </div>
            </div>
          </div>

          <!-- Correlation observations -->
          <div class="report-section-title">🌡️ Feature Correlation Analysis</div>
          <div class="report-grid-2">
            <div>
              <div class="obs-box">
                <div class="obs-title">🔗 Strong Positive Correlations</div>
                <div class="obs-text">
                  <strong>RMS ↔ SD (r ≈ 1.0):</strong> Near-perfect correlation — both measure overall vibration energy. SD is the AC component of RMS.<br><br>
                  <strong>Max ↔ Min (r ≈ 0.97):</strong> Peak amplitudes in both directions scale together due to symmetric vibration patterns.<br><br>
                  <strong>RMS ↔ Max (r ≈ 0.94):</strong> High RMS naturally implies large peak amplitudes.
                </div>
              </div>
            </div>
            <div>
              <div class="obs-box purple">
                <div class="obs-title">📐 Key Discriminating Features</div>
                <div class="obs-text">
                  <strong>Kurtosis:</strong> Most diagnostic for fault detection — low correlation with others means it provides UNIQUE information about signal impulsiveness not captured by RMS or SD.<br><br>
                  <strong>Skewness:</strong> Captures signal asymmetry. Fault type (inner vs. outer race) creates characteristic skewness patterns due to directional load impacts.<br><br>
                  <strong>Crest Factor:</strong> Peak-to-RMS ratio identifies shock events even when overall energy is low — critical for early-stage fault detection.
                </div>
              </div>
            </div>
          </div>

        </div>

              <div class="obs-box" style="margin-top:var(--sp-4)">
                <div class="obs-title">📌 Key Findings</div>
                <div class="obs-text">The Random Forest model identifies <strong>RMS, Standard Deviation, and Kurtosis</strong> as the most discriminating features. This aligns with bearing engineering theory: RMS captures energy, while kurtosis captures the impulsive nature of defect impacts. Form factor and skewness contribute as secondary discriminators.</div>

            </div>

            <div>
              <div class="report-section-title">🔬 Why These Models?</div>

                <div class="obs-title">🌲 Random Forest — Primary Model</div>

              <div class="obs-box purple">
                <div class="obs-title">✅ Model Selection Rationale</div>

                  {step:'4', icon:'📊', label:'Web Dashboard', desc:'Flask REST API + React-free frontend with Chart.js visualizations'},

              <div class="report-section-title">📋 Signal Feature Reference</div>
              <table class="fault-table" style="font-size:.72rem">
                <thead><tr><th>Feature</th><th>Formula</th><th>Diagnostic Role</th></tr></thead>

                  <tr><td><strong>Skewness</strong></td><td>μ₃/σ³</td><td>Signal asymmetry — fault directionality</td></tr>
